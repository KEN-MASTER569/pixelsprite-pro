<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 站长控制台</title>
    <style>
        body {
            background: #0b0d14;
            color: #fff;
            font-family: -apple-system, sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h2 {
            color: #00f2fe;
            text-align: center;
            margin-bottom: 30px;
        }

        .login-box {
            text-align: center;
            margin-top: 100px;
        }

        input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1f2b;
            color: #fff;
            width: 300px;
        }

        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: #00f2fe;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
        }

        button:hover {
            background: #00c2cb;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #141821;
            border-radius: 10px;
            overflow: hidden;
        }

        th,
        td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #222;
            font-size: 14px;
        }

        th {
            background: #1e2433;
            color: #00f2fe;
        }

        .status-pending {
            color: #ffea70;
            font-weight: bold;
        }

        .status-confirmed {
            color: #4ADE80;
            font-weight: bold;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
            margin-left: 0;
            background: #ff4757;
            color: white;
        }

        .btn-sm:hover {
            background: #ff2e43;
        }

        .btn-approve {
            background: #4ADE80;
            color: #000;
        }

        .btn-approve:hover {
            background: #22c55e;
        }

        #main-panel {
            display: none;
        }

        .tab-btn {
            background: transparent;
            color: #888;
            border: 1px solid #333;
        }

        .tab-btn.active {
            background: #00f2fe;
            color: #000;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>👑 PixelSprite 站长控制台</h2>

        <!-- 登录区 -->
        <div id="login-panel" class="login-box">
            <input type="password" id="adminKey" placeholder="请输入站长密钥 (ADMIN2026)">
            <button onclick="login()">进入控制台</button>
        </div>

        <!-- 控制台主面板 -->
        <div id="main-panel">
            <div style="margin-bottom: 20px;">
                <button class="tab-btn active" onclick="switchTab('orders')" id="tab-orders">💳 收款订单</button>
                <button class="tab-btn" onclick="switchTab('projects')" id="tab-projects">☁️ 云端画作</button>
                <button style="float: right; background: #ff4757; color: white; padding: 8px 15px;"
                    onclick="logout()">退出登录</button>
            </div>

            <!-- 订单列表 -->
            <div id="orders-view">
                <table>
                    <thead>
                        <tr>
                            <th>提交时间</th>
                            <th>买家邮箱</th>
                            <th>状态</th>
                            <th>激活码</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody"></tbody>
                </table>
            </div>

            <!-- 画作列表 -->
            <div id="projects-view" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>创建时间</th>
                            <th>工程名称</th>
                            <th>用户 ID</th>
                            <th>提取码</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="projects-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://pixelsprite-backend.onrender.com';
        let currentKey = '';

        function login() {
            const key = document.getElementById('adminKey').value;
            if (!key) return alert('请输入密钥');
            currentKey = key;

            // 测试请求
            fetch(`${BACKEND_URL}/api/admin/orders`, { headers: { 'x-admin-key': currentKey } })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('login-panel').style.display = 'none';
                        document.getElementById('main-panel').style.display = 'block';
                        loadOrders();
                    } else {
                        alert('密钥错误！');
                    }
                })
                .catch(() => alert('网络错误，请检查后端是否存活'));
        }

        function logout() {
            location.reload();
        }

        function switchTab(tab) {
            document.getElementById('orders-view').style.display = tab === 'orders' ? 'block' : 'none';
            document.getElementById('projects-view').style.display = tab === 'projects' ? 'block' : 'none';
            document.getElementById('tab-orders').classList.toggle('active', tab === 'orders');
            document.getElementById('tab-projects').classList.toggle('active', tab === 'projects');

            if (tab === 'orders') loadOrders();
            else loadProjects();
        }

        async function loadOrders() {
            const tbody = document.getElementById('orders-tbody');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">⏳ 加载中...</td></tr>';

            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/orders`, { headers: { 'x-admin-key': currentKey } });
                const result = await res.json();

                tbody.innerHTML = '';
                if (result.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">目前没有订单</td></tr>';
                    return;
                }

                result.data.forEach(order => {
                    const tr = document.createElement('tr');
                    const isPending = order.status === 'pending';

                    tr.innerHTML = `
                        <td>${new Date(order.created_at).toLocaleString()}</td>
                        <td>${order.email}</td>
                        <td class="${isPending ? 'status-pending' : 'status-confirmed'}">${order.status.toUpperCase()}</td>
                        <td style="font-family: monospace; color: #00f2fe;">${order.license_key}</td>
                        <td>
                            ${isPending ? `<button class="btn-sm btn-approve" onclick="approveOrder('${order.email}')">✅ 确认发码</button>` : ''}
                            <button class="btn-sm" onclick="deleteOrder('${order.id}')">🗑️ 删除</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="5" style="color:#ff4757; text-align:center;">加载失败，请检查网络</td></tr>';
            }
        }

        async function approveOrder(email) {
            if (!confirm(`确定已收到 ${email} 的付款并发送激活码吗？`)) return;
            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/confirm-payment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminKey: currentKey, email })
                });
                const result = await res.json();
                if (result.success) {
                    alert('✅ 发码成功！');
                    loadOrders();
                } else {
                    alert('❌ 失败: ' + result.error);
                }
            } catch (err) {
                alert('网络错误');
            }
        }

        async function deleteOrder(id) {
            if (!confirm('确定要删除这条订单记录吗？')) return;
            try {
                await fetch(`${BACKEND_URL}/api/admin/orders/${id}`, {
                    method: 'DELETE',
                    headers: { 'x-admin-key': currentKey }
                });
                loadOrders();
            } catch (err) {
                alert('删除失败');
            }
        }

        async function loadProjects() {
            const tbody = document.getElementById('projects-tbody');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">⏳ 加载中...</td></tr>';

            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/projects`, { headers: { 'x-admin-key': currentKey } });
                const result = await res.json();

                tbody.innerHTML = '';
                if (result.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">目前没有画作</td></tr>';
                    return;
                }

                result.data.forEach(proj => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${new Date(proj.created_at).toLocaleString()}</td>
                        <td>${proj.project_name || '未命名'}</td>
                        <td>${proj.user_id}</td>
                        <td style="font-family: monospace; color: #00f2fe;">${proj.pin_code}</td>
                        <td>
                            <button class="btn-sm" onclick="deleteProject('${proj.pin_code}')">🗑️ 删除</button>
                        </td>
                    `;
                    tbody.appendChild(tbody);
                });
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="5" style="color:#ff4757; text-align:center;">加载失败，请检查网络</td></tr>';
            }
        }

        async function deleteProject(pinCode) {
            if (!confirm(`确定要删除提取码为 ${pinCode} 的画作吗？`)) return;
            try {
                await fetch(`${BACKEND_URL}/api/admin/projects/${pinCode}`, {
                    method: 'DELETE',
                    headers: { 'x-admin-key': currentKey }
                });
                loadProjects();
            } catch (err) {
                alert('删除失败');
            }
        }
    </script>
</body>

</html>
